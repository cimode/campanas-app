  <div style="display: flex; flex-direction: column; gap: 12px">

  </div>
  <form style="display: flex; flex-direction: column; gap: 10px">

      <input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Dígito 3" style="height: 60px; text-align: center; border: 2px solid #0A1033; border-radius: 12px; background: #FFFFFF; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 30px; color: #0A1033; min-width: 0">

      <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5" style="height: 60px; text-align: center; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 30px; color: #0A1033; min-width: 0">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6" style="height: 60px; text-align: center; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 30px; color: #0A1033; min-width: 0">
    </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="PerfilLider.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: {{primary}}; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 18px">Confirmar código</a>

    </div>
  </div>
  <div style="margin-top: auto; display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 1.5px solid #D8DBEA; border-radius: 16px; padding: 14px 16px">
