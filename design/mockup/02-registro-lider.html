<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Registro de líder · Paso 1</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Barlow',system-ui,sans-serif;color:#0A1033;background:#F4F5FB}
a{color:#1B3DE6}a:hover{color:#0F27A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5FB; overflow: hidden">
  <div style="background: {{primary}}; color: #FFFFFF; padding: 60px 24px 22px 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Main.dc.html" aria-label="Volver" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.16); color: #FFFFFF; text-decoration: none"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; background: {{accent}}; padding: 6px 10px; border-radius: 999px">Paso 1 de 2</span>
    </div>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.95; text-transform: uppercase">Regístrate como líder</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.4; opacity: 0.9">Los datos marcados como únicos se verifican contra la red para evitar duplicados.</p>
  </div>
  <form style="flex-grow: 1; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="nombre" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Nombre</label>
        <input id="nombre" type="text" placeholder="Ana" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="apellido" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Apellido</label>
        <input id="apellido" type="text" placeholder="Pérez" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="cedula" style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180"><span>Cédula</span><span style="color: {{primary}}">Campo único</span></label>
      <input id="cedula" type="text" inputmode="numeric" placeholder="1 020 304 050" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="telefono" style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180"><span>Teléfono (WhatsApp)</span><span style="color: {{primary}}">Campo único</span></label>
      <input id="telefono" type="tel" placeholder="+57 300 000 0000" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="departamento" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Departamento</label>
        <sc-raw-select id="departamento" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033"><option>Santander</option><option>Antioquia</option></sc-raw-select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="municipio" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Municipio</label>
        <sc-raw-select id="municipio" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033"><option>Bucaramanga</option><option>Girón</option></sc-raw-select>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="clave" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Clave de acceso</label>
      <input id="clave" type="password" placeholder="Mínimo 8 caracteres" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: flex; align-items: flex-start; gap: 10px; padding-top: 4px">
      <input id="terminos" type="checkbox" style="width: 22px; height: 22px; margin: 2px 0 0 0; accent-color: #1B3DE6">
      <label for="terminos" style="font-size: 13px; line-height: 1.4; color: #0A1033">Acepto los <a href="#terminos">términos</a> y la <a href="#datos">política de tratamiento de datos</a>. Sin esta aceptación no se crea el registro.</label>
    </div>
  </form>
  <div style="padding: 12px 24px 32px 24px; background: #F4F5FB">
    <a href="Validacion.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 18px">Crear mi registro</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;primary&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1B3DE6&quot;,&quot;options&quot;:[&quot;#1B3DE6&quot;,&quot;#0A1033&quot;,&quot;#C8102E&quot;,&quot;#007A3D&quot;]},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8176F&quot;,&quot;options&quot;:[&quot;#E8176F&quot;,&quot;#FFB800&quot;,&quot;#00B2A9&quot;,&quot;#FF5A1F&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#1B3DE6', accent: this.props.accent ?? '#E8176F' };
  }
}
</script>


</body></html>
