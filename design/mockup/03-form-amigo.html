<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Formulario corto de amigo</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Barlow',system-ui,sans-serif;color:#0A1033;background:#F4F5FB}
a{color:#1B3DE6}a:hover{color:#0F27A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5FB; overflow: hidden">
  <div style="background: #0A1033; color: #FFFFFF; padding: 60px 24px 22px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Main.dc.html" aria-label="Volver" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.14); color: #FFFFFF; text-decoration: none"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; background: {{primary}}; padding: 6px 10px; border-radius: 999px">Formulario corto</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.08); border-radius: 14px; padding: 12px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 20px">LR</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8">Te invita</span>
        <span style="font-size: 17px; font-weight: 700">[NOMBRE DEL LÍDER] · Comuna 5</span>
      </div>
    </div>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.95; text-transform: uppercase">Deja tus datos y listo</h1>
  </div>
  <form style="flex-grow: 1; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="nombre" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Nombre completo</label>
      <input id="nombre" type="text" placeholder="Carlos Rojas" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="email" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Email</label>
      <input id="email" type="email" placeholder="carlos@correo.com" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="telefono" style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180"><span>Teléfono (WhatsApp)</span><span style="color: {{primary}}">Campo único</span></label>
      <input id="telefono" type="tel" placeholder="+57 300 000 0000" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="cedula" style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180"><span>Cédula</span><span style="color: {{primary}}">Campo único</span></label>
      <input id="cedula" type="text" inputmode="numeric" placeholder="1 020 304 050" style="height: 48px; padding: 0 14px; border: 1.5px solid #DC2626; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
      <p style="margin: 2px 0 0 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #B91C1C"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>Registro bloqueado: esta cédula ya está en la red.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="puesto" style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180"><span>Puesto de votación</span><span style="color: #5B6180; font-weight: 500; text-transform: none; letter-spacing: 0">Campo configurado</span></label>
      <input id="puesto" type="text" placeholder="Colegio Santander, mesa 12" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: flex; align-items: flex-start; gap: 10px; padding-top: 4px">
      <input id="terminos" type="checkbox" checked="" style="width: 22px; height: 22px; margin: 2px 0 0 0; accent-color: #1B3DE6">
      <label for="terminos" style="font-size: 13px; line-height: 1.4; color: #0A1033">Acepto los <a href="#terminos">términos</a> y la <a href="#datos">política de tratamiento de datos</a>.</label>
    </div>
  </form>
  <div style="padding: 12px 24px 32px 24px; background: #F4F5FB">
    <a href="Validacion.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 18px">Enviar y validar por WhatsApp</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;primary&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1B3DE6&quot;,&quot;options&quot;:[&quot;#1B3DE6&quot;,&quot;#0A1033&quot;,&quot;#C8102E&quot;,&quot;#007A3D&quot;]},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8176F&quot;,&quot;options&quot;:[&quot;#E8176F&quot;,&quot;#FFB800&quot;,&quot;#00B2A9&quot;,&quot;#FF5A1F&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#1B3DE6', accent: this.props.accent ?? '#E8176F' };
  }
}
</script>


</body></html>
