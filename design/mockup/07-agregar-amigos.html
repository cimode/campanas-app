<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Agregar amigos</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Barlow',system-ui,sans-serif;color:#0A1033;background:#F4F5FB}
a{color:#1B3DE6}a:hover{color:#0F27A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5FB; padding: 56px 24px 32px 24px; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="PerfilLider.dc.html" aria-label="Volver al perfil" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #D8DBEA; color: #0A1033; text-decoration: none"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: {{primary}}">Fase 3 · Multiplicación</span>
  </div>
  <h1 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.95; text-transform: uppercase">Suma amigos a tu red</h1>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 14px; background: #25D366; color: #FFFFFF; border: 0; font: inherit; font-weight: 700; font-size: 15px"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.4L3 21l2.1-5.3A8.5 8.5 0 1 1 21 11.5z"></path></svg>Por WhatsApp</button>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 14px; background: #FFFFFF; color: #0A1033; border: 2px solid #0A1033; font: inherit; font-weight: 700; font-size: 15px"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Copiar enlace</button>
  </div>
  <p style="margin: -6px 0 0 0; font-size: 13px; line-height: 1.4; color: #5B6180">Con el enlace, tu amigo llena el formulario corto y valida su número él mismo.</p>
  <div style="display: flex; align-items: center; gap: 12px"><div style="flex-grow: 1; height: 1.5px; background: #D8DBEA"></div><span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #5B6180">o agrégalo manualmente</span><div style="flex-grow: 1; height: 1.5px; background: #D8DBEA"></div></div>
  <form style="display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 1.5px solid #D8DBEA; border-radius: 16px; padding: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="nombre" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Nombre completo</label>
      <input id="nombre" type="text" placeholder="María Gómez" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="telefono" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Teléfono (WhatsApp)</label>
      <input id="telefono" type="tel" placeholder="+57 300 000 0000" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="cedula" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B6180">Cédula</label>
      <input id="cedula" type="text" inputmode="numeric" placeholder="1 020 304 050" style="height: 48px; padding: 0 14px; border: 1.5px solid #D8DBEA; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; color: #0A1033">
    </div>
    <a href="Validacion.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px; margin-top: 4px">Agregar y enviarle el código</a>
  </form>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #5B6180">Pendientes de confirmar</span>
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1.5px dashed #9CA3AF; border-radius: 12px; padding: 10px 12px; min-height: 52px; box-sizing: border-box">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #9CA3AF; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-weight: 600; font-size: 15px">Andrés Quintero</span>
      <span style="font-size: 12px; font-weight: 600; color: #5B6180">Código enviado · 10 min</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;primary&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1B3DE6&quot;,&quot;options&quot;:[&quot;#1B3DE6&quot;,&quot;#0A1033&quot;,&quot;#C8102E&quot;,&quot;#007A3D&quot;]},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8176F&quot;,&quot;options&quot;:[&quot;#E8176F&quot;,&quot;#FFB800&quot;,&quot;#00B2A9&quot;,&quot;#FF5A1F&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#1B3DE6', accent: this.props.accent ?? '#E8176F' };
  }
}
</script>


</body></html>
